<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ECharts 粘贴数据绘图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      height: 100vh;
      box-sizing: border-box;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      padding: 8px;
      font-family: monospace;
      box-sizing: border-box;
    }
    button {
      width: 120px;
      padding: 6px;
      cursor: pointer;
    }
    #chart {
      flex: 1;
    }
  </style>
</head>
<body>

<div id="container">
  <textarea id="dataInput" placeholder="粘贴数据：&#10;10&#10;20&#10;30&#10;或&#10;A,10&#10;B,20"></textarea>
  <button onclick="renderChart()">绘图</button>
  <div id="chart"></div>
</div>

<script>
  const chart = echarts.init(document.getElementById('chart'));

  function renderChart() {
    const raw = document.getElementById('dataInput').value.trim();
    if (!raw) return;

    const lines = raw.split(/\r?\n/);
    const xData = [];
    const yData = [];

    lines.forEach((line, idx) => {
      const parts = line.split(',');
      if (parts.length === 1) {
        xData.push(idx + 1);
        yData.push(Number(parts[0]));
      } else {
        xData.push(parts[0].trim());
        yData.push(Number(parts[1]));
      }
    });

    chart.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: 60, right: 40, bottom: 80 },
      xAxis: { type: 'category', data: xData },
      yAxis: { type: 'value' },
      dataZoom: [
        { type: 'slider', start: 0, end: 30 },
        { type: 'inside' }
      ],
      series: [{
        type: 'line',
        data: yData,
        smooth: true,
        sampling: 'lttb',
        large: true
      }]
    }, true);
  }

  window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
